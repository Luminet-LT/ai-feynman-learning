    <rect x="94" y="376" width="492" height="10" rx="5" fill="#f26b38"/>
    <text x="94" y="445" fill="#40506f" font-size="26" font-weight="500">Research. Interview. Learn. Explain. Verify.</text>
    <text x="94" y="492" fill="#40506f" font-size="22">A course-building protocol for AI agents that refuses to confuse</text>
    <text x="94" y="528" fill="#14213d" font-size="22" font-weight="700">“I read it” with “I can teach it.”</text>
    <g transform="translate(81 585)">
      <rect width="150" height="48" rx="24" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
