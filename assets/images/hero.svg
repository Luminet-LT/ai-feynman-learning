      <rect x="170" width="175" height="48" rx="24" fill="#f26b38"/>
      <text x="257" y="31" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">10 MODULES</text>
      <rect x="365" width="160" height="48" rx="24" fill="#d8f36b"/>
      <text x="445" y="31" text-anchor="middle" fill="#14213d" font-size="16" font-weight="700">7 STAGES</text>
    </g>
    <g transform="translate(970 126)" filter="url(#shadow)">
      <circle cx="285" cy="255" r="236" fill="#14213d"/>
      <circle cx="285" cy="255" r="194" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="8 10"/>
      <circle cx="285" cy="255" r="135" fill="#f26b38"/>
      <path d="M285 28 A227 227 0 0 1 512 255" fill="none" stroke="#d8f36b" stroke-width="6" marker-end="url(#arrow)"/>
      <path d="M285 482 A227 227 0 0 1 58 255" fill="none" stroke="#76c7c0" stroke-width="6" marker-end="url(#arrow)"/>
      <text x="285" y="239" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800" letter-spacing="1">EXPLAIN</text>
      <text x="285" y="281" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="500">it simply.</text>
      <g>
        <circle cx="285" cy="19" r="44" fill="#d8f36b"/>
        <text x="285" y="26" text-anchor="middle" fill="#14213d" font-size="16" font-weight="800">RESEARCH</text>
      </g>
      <g>
