  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <circle cx="1480" cy="70" r="150" fill="#d8f36b" opacity="0.85"/>
  <circle cx="1430" cy="660" r="110" fill="#76c7c0" opacity="0.45"/>
