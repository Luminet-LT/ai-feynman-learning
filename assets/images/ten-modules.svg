<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d35"/>
      <stop offset="1" stop-color="#192c48"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1475" cy="66" r="155" fill="#f26b38" opacity="0.12"/>
  <circle cx="80" cy="835" r="180" fill="#76c7c0" opacity="0.09"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="76" y="86" fill="#d8f36b" font-size="18" font-weight="800" letter-spacing="3">LECTURE STANDARD</text>
    <text x="76" y="153" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-2">Every section has 10 modules.</text>
    <text x="76" y="194" fill="#aab5c7" font-size="21">Depth is visible: definitions, demonstrations, practice, transfer and explanation.</text>
    <rect x="1390" y="64" width="132" height="48" rx="24" fill="#d8f36b"/>
    <text x="1456" y="95" text-anchor="middle" fill="#14213d" font-size="17" font-weight="800">HARD RULE</text>

    <g filter="url(#glow)">
      <g transform="translate(76 250)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#f26b38"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">01</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">LEARNING</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">NAVIGATION</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Time, goal, prerequisites</text><text x="28" y="192" fill="#606d83" font-size="15">and mastery standard.</text>
      </g>
      <g transform="translate(370 250)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#76c7c0"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">02</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">PRE-CLASS</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">RETRIEVAL</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Recall before the answer.</text><text x="28" y="192" fill="#606d83" font-size="15">At least two prompts.</text>
      </g>
      <g transform="translate(664 250)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#d8f36b"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">03</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">PROBLEM</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">CONTEXT</text>
        <text x="28" y="169" fill="#606d83" font-size="15">A real scenario and the</text><text x="28" y="192" fill="#606d83" font-size="15">common wrong intuition.</text>
      </g>
      <g transform="translate(958 250)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#f26b38"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">04</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">CONCEPT</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">CONSTRUCTION</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Plain definition, formal form,</text><text x="28" y="192" fill="#606d83" font-size="15">mechanism and boundaries.</text>
      </g>
      <g transform="translate(1252 250)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#76c7c0"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">05</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">WORKED</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">DEMO</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Expert reasoning, at least</text><text x="28" y="192" fill="#606d83" font-size="15">three steps and two examples.</text>
      </g>
      <g transform="translate(76 510)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#d8f36b"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">06</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">FADED</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">PRACTICE</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Structured support fades</text><text x="28" y="192" fill="#606d83" font-size="15">as the learner takes over.</text>
      </g>
      <g transform="translate(370 510)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#f26b38"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">07</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">VARIATIONS &amp;</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">ERROR DIAGNOSIS</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Near and far transfer,</text><text x="28" y="192" fill="#606d83" font-size="15">mistakes and corrections.</text>
      </g>
      <g transform="translate(664 510)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#76c7c0"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">08</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">RETRIEVAL</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">PRACTICE</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Answer without looking,</text><text x="28" y="192" fill="#606d83" font-size="15">then inspect the gap.</text>
      </g>
      <g transform="translate(958 510)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#d8f36b"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">09</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">FEYNMAN</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">OUTPUT</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Explain, receive feedback,</text><text x="28" y="192" fill="#606d83" font-size="15">then answer a follow-up.</text>
      </g>
      <g transform="translate(1252 510)">
        <rect width="270" height="230" rx="20" fill="#f9f5ec"/>
        <rect width="270" height="8" rx="4" fill="#f26b38"/>
        <circle cx="34" cy="38" r="22" fill="#14213d"/><text x="34" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">10</text>
        <text x="28" y="104" fill="#14213d" font-size="20" font-weight="800">REVIEW &amp;</text><text x="28" y="130" fill="#14213d" font-size="20" font-weight="800">TRANSFER</text>
        <text x="28" y="169" fill="#606d83" font-size="15">Summary, transfer task and</text><text x="28" y="192" fill="#606d83" font-size="15">1-3-7-15 day review.</text>
      </g>
    </g>
    <g transform="translate(76 800)">
      <rect width="1446" height="58" rx="18" fill="#f9f5ec"/>
      <text x="30" y="37" fill="#14213d" font-size="18" font-weight="800">THE EXPLANATION TEST</text>
      <text x="274" y="37" fill="#606d83" font-size="18">If a module is missing, empty, or unsupported by sources, the lecture is not finished.</text>
    </g>
  </g>
</svg>